[project]
name = "findex"
version = "0.4.0"
description = "Пошуковий рушій з булевими запитами та ранжуванням BM25"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.1",
    "matplotlib>=3.11.2",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.350",
    "ruff>=0.3.0",
]

[tool.pyright]
include = ["src"]
exclude = ["build", "dist", ".venv", "tests", "scripts", "benchmark*.py"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = "src"
markers = [
    "slow: позначка для тестів, які виконуються довше 1 секунди",
]
