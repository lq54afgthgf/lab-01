[project]
name = "findex"
version = "0.4.0"
description = "Пошуковий рушій з булевими запитами та ранжуванням BM25"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.1",
    "matplotlib>=3.11.2",
    "httpx>=0.28.1",
    "selectolax>=1.0.2; python_version != '3.13'",
    "fastapi>=0.162.0; python_version != '3.13'",
    "uvicorn>=0.54.0; python_version != '3.13'",
    "pydantic>=2.14.2; python_version != '3.13'",
    "pydantic-settings>=2.16.2; python_version != '3.13'",
    "jinja2>=3.1.6",
    "sentence-transformers>=6.2.0; python_version != '3.13'",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.350",
    "ruff>=0.3.0",
    "py-spy>=0.4.2",
    "pytest-benchmark>=5.3.0",
    "hypothesis>=6.170.14; python_version != '3.13'",
    "pytest-asyncio>=1.4.1",
    "pytest-httpx>=0.36.2",
]

[tool.pyright]
include = ["src"]
exclude = ["build", "dist", ".venv", "tests", "scripts", "benchmark*.py"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = "src"
markers = [
    "slow: позначка для тестів, які виконуються довше 1 секунди",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "BLE001", "B008", "ASYNC230", "SIM117", "PYI025", "UP047", "LOG014", "RUF059"]
